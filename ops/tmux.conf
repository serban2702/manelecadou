# tmux config pentru terminalul ops (copiat în /etc/tmux.conf la build).
# FIX scroll în ttyd: cu `mouse on`, rotița intră automat în copy-mode și
# derulează istoricul; în aplicații full-screen (Claude Code) tmux traduce
# rotița în săgeți. Fără asta, scroll-ul în browser nu face nimic.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "xterm-256color"
# Responsiveness în TUI-uri (Claude Code) — fără pauza default de 500ms la Esc.
set -sg escape-time 10
# Status bar discret, în tema site-ului (gold pe negru).
set -g status-style "bg=#1a1410,fg=#d4af37"
set -g status-left " ops "
set -g status-right "%H:%M "
set -g window-status-current-style "fg=#0a0606,bg=#d4af37"
