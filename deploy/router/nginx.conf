# Router intern pentru stack-ul nou (Nginx Proxy Manager / Traefik termină TLS).
#
# Reverse proxy-ul extern trimite TOT traficul aici, pe un singur upstream
# (`router:80`). Split-ul pe path și pe host îl face acest fișier — exact ce
# făcea Caddyfile-ul, dar fără management de certificate.
#
#   admin.<domeniu>   /api /socket.io /health /uploads → api:3000
#                     /ops /ops-chat                   → ops:7681 / ops:7682
#                     restul                           → admin:1505
#   orice alt host    /api /socket.io /health /uploads → api:3000
#                     restul                           → web:1500
#
# Ca să adaugi un site nou în NPM e de ajuns un Proxy Host cu domeniul nou →
# `router:80`. Fără configurație custom per domeniu.
#
# Se montează ca /etc/nginx/conf.d/default.conf (context `http`).

# Docker DNS. Upstream-urile sunt trecute prin variabile ca nginx să le
# re-rezolve la fiecare request — altfel păstrează IP-ul vechi după un
# `docker compose up -d --force-recreate api`.
resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# NPM e un hop, noi suntem al doilea ⇒ API-ul rulează cu TRUST_PROXY_HOPS=2.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Upload-uri: mostre audio, poze de colaj, atașamente chat, logo-uri.
client_max_body_size 200M;
proxy_request_buffering off;
proxy_read_timeout  600s;
proxy_send_timeout  600s;

# Headere de securitate. HSTS îl pune NPM (el are TLS-ul); aici restul.
# frame-ancestors lasă player-ul OpenReplay să randeze site-ul în iframe.
add_header X-Content-Type-Options  "nosniff" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://openreplay.manelecadou.ro" always;

server {
    listen 80 default_server;
    server_name _;

    set $api_up   "api:3000";
    set $web_up   "web:1500";

    # /health e la rădăcină în NestJS (setGlobalPrefix('api') îl exclude).
    location = /health {
        proxy_pass http://$api_up$request_uri;
    }

    location /api/ {
        proxy_pass http://$api_up$request_uri;
    }

    location /socket.io/ {
        proxy_pass http://$api_up$request_uri;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Assets publice — CORS permisiv ca serviciul `assets` din OpenReplay să le
    # poată descărca pentru replay vizual fidel (CLAUDE.md §15.7 pct. 11).
    # add_header într-un location înlocuiește moștenirile, deci le repetăm.
    location /uploads/ {
        proxy_pass http://$api_up$request_uri;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control                "public, max-age=86400" always;
    }

    location /_next/static/ {
        proxy_pass http://$web_up$request_uri;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location / {
        proxy_pass http://$web_up$request_uri;
    }
}

server {
    listen 80;
    server_name ~^admin\. admin.localhost;

    set $api_up   "api:3000";
    set $admin_up "admin:1505";
    set $ops_up   "ops:7681";
    set $opsc_up  "ops:7682";

    location = /health { proxy_pass http://$api_up$request_uri; }
    location /api/     { proxy_pass http://$api_up$request_uri; }

    location /socket.io/ {
        proxy_pass http://$api_up$request_uri;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /uploads/ { proxy_pass http://$api_up$request_uri; }

    # Terminal ops (ttyd, Basic Auth propriu) + bridge-ul de chat (SSE) —
    # CLAUDE.md §17. Dacă serviciul `ops` nu rulează, doar aceste path-uri dau
    # 502; restul admin-ului merge normal.
    location /ops {
        proxy_pass http://$ops_up$request_uri;
        proxy_read_timeout 3600s;
    }

    location /ops-chat {
        proxy_pass http://$opsc_up$request_uri;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://$admin_up$request_uri;
    }
}
