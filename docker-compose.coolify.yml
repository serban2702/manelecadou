# Stack-ul pentru COOLIFY. Fără Caddy: TLS-ul și domeniile le ține Traefik-ul
# Coolify. Fișierele merg pe Cloudflare R2.
#
#   internet → Traefik (Coolify, TLS) → router:80 → api / web / admin
#
# `router` (nginx, config în deploy/router/nginx.conf) face split-ul pe path și
# pe host, exact ca vechiul Caddyfile.
#
# ÎN COOLIFY: domeniile se pun pe UN SINGUR serviciu — `router`. Toate
# domeniile publice + `admin.<domeniu>`, în câmpul „Domains" al serviciului.
# Celelalte servicii (api, web, admin, postgres, redis) rămân FĂRĂ domeniu.
#
# De ce nu domenii per serviciu: ruta publică e împărțită pe path
# (`/api`, `/socket.io`, `/health`, `/uploads` → api; restul → web), deci
# varianta nativă ar cere 4 intrări de path pe serviciul `api` pentru FIECARE
# domeniu de tenant, plus grija la stripPrefix. Cu `router`, un domeniu nou =
# o intrare într-un singur câmp. Vezi docs/COOLIFY_R2.md §2.
#
# `apps/api/scripts/coolify-domains.mjs` generează lista de domenii din DB,
# gata de lipit.
#
# Postgres și Redis sunt aici, în stack. Dacă preferi resursele gestionate de
# Coolify (backup-uri programate din UI), scoate-le de aici și pune
# POSTGRES_HOST / REDIS_HOST pe hostname-urile date de Coolify.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Volum dedicat de dump-uri. Pe Ionos backup-ul dinaintea fiecărui deploy
      # îl făcea `deploy.sh`; pe Coolify deploy-ul îl face Coolify, deci plasa
      # de siguranță se reface din „Pre-deployment Command" pe containerul
      # `postgres`, care scrie aici. Obligatoriu cât timp `synchronize: true`
      # execută DDL la fiecare boot. Comenzile exacte: docs/COOLIFY_R2.md §3.6.
      - pg_backups:/backups
    healthcheck:
      # pg_dump --version în test ca stack-ul să nu pornească fără binarul de backup.
      test: ["CMD-SHELL", "pg_dump --version >/dev/null && pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3000
      # Traefik + router = 2 hop-uri de proxy. Fără asta req.ip e IP-ul router-ului
      # → throttler global și IP greșit în analytics/OpenReplay.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: ${APP_URL}
      ADMIN_URL: ${ADMIN_URL}
      API_URL: ${API_URL}
      DEFAULT_SITE_DOMAIN: ${DEFAULT_SITE_DOMAIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MAGIC_LINK_TTL_MIN: ${MAGIC_LINK_TTL_MIN:-15}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      MAIL_CRED_KEY: ${MAIL_CRED_KEY:-}

      # --- Fișiere: Cloudflare R2 -------------------------------------------
      # DB-ul păstrează path-uri /uploads/... ; GET /uploads face 302 spre
      # R2_PUBLIC_URL (sau streamează din bucket dacă nu e domeniu public).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      # `db`: în producție bucketul și cheile se schimbă din admin → Setări,
      # fără redeploy. Bucketul ACTIV apare în logurile API-ului la boot
      # („storage=r2 bucket=…") — verifică-l după primul deploy.
      STORAGE_CONFIG_SOURCE: ${STORAGE_CONFIG_SOURCE:-db}
      UPLOADS_DIR: /app/uploads
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

      # --- Microserviciu media (ffmpeg/resvg pe Hetzner). Gol → local --------
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL:-}
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN:-}

      # --- Mail --------------------------------------------------------------
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mailgun}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_REGION: ${MAILGUN_REGION:-us}
      MAILGUN_API_URL: ${MAILGUN_API_URL:-}
      MAILGUN_FROM_EMAIL: ${MAILGUN_FROM_EMAIL:-}
      MAILGUN_WEBHOOK_SIGNING_KEY: ${MAILGUN_WEBHOOK_SIGNING_KEY:-}
      MAIL_ATTACH_DIR: /app/mail-attach
      MAIL_POLL_INTERVAL_MS: ${MAIL_POLL_INTERVAL_MS:-60000}

      # --- Motoare audio -----------------------------------------------------
      SUNO_PROVIDER: ${SUNO_PROVIDER:-real}
      SUNO_API_BASE_URL: ${SUNO_API_BASE_URL:-https://api.sunoapi.org}
      SUNO_API_KEY: ${SUNO_API_KEY:-}
      SUNO_MODEL: ${SUNO_MODEL:-V4_5}
      SUNO_CREDIT_MONITOR_ENABLED: ${SUNO_CREDIT_MONITOR_ENABLED:-}
      SUNO_CREDIT_ALERT_THRESHOLD: ${SUNO_CREDIT_ALERT_THRESHOLD:-}
      # Google Lyria (motor alternativ, ales per interfață din admin).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LYRIA_MODEL: ${LYRIA_MODEL:-}

      # --- Plăți -------------------------------------------------------------
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_PRICE_FULL_RON: ${STRIPE_PRICE_FULL_RON:-}

      # --- OpenAI + AI chat (Irina) ------------------------------------------
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_AUTOREPLY_MODEL: ${OPENAI_AUTOREPLY_MODEL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_CHAT_TEMPERATURE: ${AI_CHAT_TEMPERATURE:-}
      AI_CHAT_SYSTEM_PROMPT: ${AI_CHAT_SYSTEM_PROMPT:-}
      AI_CHAT_MODE_DEFAULT: ${AI_CHAT_MODE_DEFAULT:-manual}
      AI_CHAT_REQUIRE_APPROVAL_FOR_PAYMENT: ${AI_CHAT_REQUIRE_APPROVAL_FOR_PAYMENT:-true}
      AI_CHAT_REQUIRE_APPROVAL_FOR_GENERATION: ${AI_CHAT_REQUIRE_APPROVAL_FOR_GENERATION:-true}
      AI_CHAT_LEARN_NIGHTLY: ${AI_CHAT_LEARN_NIGHTLY:-false}

      # --- Web Push admin ----------------------------------------------------
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      # --- Analytics / alerte ------------------------------------------------
      GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_ID:-}
      GA4_API_SECRET: ${GA4_API_SECRET:-}
      META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN:-}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WINGO_API_KEY: ${WINGO_API_KEY:-}
      WINGO_NOTIFY_URL: ${WINGO_NOTIFY_URL:-}
      LOGS_DIR: /app/logs

      # Gate suplimentar pe /admin/database (aceleași user:parolă ca ops).
      OPS_TERMINAL_CREDENTIAL: ${OPS_TERMINAL_CREDENTIAL:-}
      WEB_INTERNAL_URL: http://web:1500
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    volumes:
      # Rămân și pe R2: volumul local e cache pentru ffmpeg + fallback dacă
      # STORAGE_DRIVER=disk. Nu-l șterge înainte de sync-ul complet pe R2.
      - api_uploads:/app/uploads
      - api_backups:/app/backups
      # Doar CITIRE, pentru atașamentele de dinainte de migrarea pe R2: scrierile
      # noi merg în uploads (`mail-attach/...`). Se poate scoate după ce
      # `scripts/migrate-mail-attachments-to-r2.mjs` a rescris toate rândurile.
      - api_mail_attach:/app/mail-attach
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${NEXT_PUBLIC_TIKTOK_PIXEL_ID:-}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-ro}
        NEXT_PUBLIC_SHOW_LANG_SWITCHER: ${NEXT_PUBLIC_SHOW_LANG_SWITCHER:-false}
        NEXT_PUBLIC_OPENREPLAY_PROJECT_KEY: ${NEXT_PUBLIC_OPENREPLAY_PROJECT_KEY:-}
        NEXT_PUBLIC_OPENREPLAY_INGEST_POINT: ${NEXT_PUBLIC_OPENREPLAY_INGEST_POINT:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

  # SINGURUL serviciu care primește domenii în Coolify.
  #
  # Alternativ la câmpul „Domains" din UI, poți declara domeniul aici cu
  # variabila magică a lui Coolify (o singură valoare; restul domeniilor tot
  # din UI):
  #   environment:
  #     SERVICE_FQDN_ROUTER_80: https://manelecadou.ro
  router:
    # Config COPIAT în imagine, nu montat: Coolify presupune că un bind mount
    # scris ca string e director, deci ar transforma nginx.conf într-un folder
    # și tot traficul ar cădea pe pagina implicită nginx. Vezi
    # deploy/router/Dockerfile.
    build:
      context: ./deploy/router
      dockerfile: Dockerfile
    restart: unless-stopped
    # `expose`, nu `ports`: Traefik-ul Coolify ajunge la container prin rețeaua
    # Docker, nu printr-un port publicat pe host.
    expose:
      - "80"
    depends_on:
      - api
      - web
      - admin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # NU e aici serviciul `ops` (terminalul Claude Code din CLAUDE.md §17).
  # Motiv: Coolify NU citește `profiles:` din compose — nici parserul
  # (bootstrap/helpers/shared.php), nici jobul de deploy nu îl pomenesc — deci
  # un serviciu marcat `profiles: ["ops"]` ar fi construit și pornit oricum, la
  # fiecare deploy. Imaginea are node + claude-code + ttyd + tmux și containerul
  # e inutil fără un login interactiv, așa că nu are ce căuta în deploy-ul
  # automat.
  #
  # Definiția rămâne în `docker-compose.prod.yml` (stack-ul Ionos). Pe Coolify,
  # dacă vrei terminalul, îl adaugi ca resursă separată în ACELAȘI proiect, ca
  # să prindă rețeaua stack-ului. Routerul îl tolerează lipsă: `/ops` și
  # `/ops-chat` merg pe upstream prin variabilă, deci dau 502, nu rup nginx-ul.

volumes:
  pg_data:
  pg_backups:
  redis_data:
  api_uploads:
  api_backups:
  api_mail_attach:
  api_logs:
